name: Daily Global Bus Tech News Update

on:
  schedule:
    # Chạy mỗi ngày lúc 00:00 UTC (07:00 sáng giờ Việt Nam)
    - cron: '0 0 * * *'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên GitHub bất cứ lúc nào

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "news-update"
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Latest Bus Tech News
        run: |
          python fetch_news.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git commit -m "Auto-update: Global Bus Technology News [skip ci]" || echo "No changes to commit"
          git push
